<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AI 研究工作台：提一个问题，拿到一份每一步可见、每条结论可溯源的研究报告。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Research Workspace — Explore New Ideas</title>

    <!--
      字体：Poppins 300–800，全站唯一字族（中文回落到系统黑体）。
      字体文件自托管在 /fonts（约 8KB/字重），不再依赖 Google Fonts ——
      外链 CSS 是渲染阻塞资源，国内网络下会拖住首屏。
    -->
  </head>
  <body>
    <div id="root"></div>
    <!-- 未启用 JS 的极少数场景：给出可读说明，而不是一片空白 -->
    <noscript>
      <div style="max-width: 520px; margin: 12vh auto; padding: 24px; font-family: system-ui, sans-serif; color: #fff; background: #000; border: 1px solid rgba(255,255,255,.2); border-radius: 2px;">
        <h1 style="margin: 0 0 8px; font-size: 20px; font-weight: 500;">需要启用 JavaScript</h1>
        <p style="margin: 0; line-height: 1.7; color: rgba(255,255,255,.6);">
          AI 研究工作台是一个交互式单页应用，请在浏览器中启用 JavaScript 后重新打开本页。
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
